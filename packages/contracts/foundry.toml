[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fuzz = { runs = 256 }

[lint]
# The ERC-1056 registry is vendored verbatim from ethr-did-registry@2.0.0; do not lint it.
ignore = ["src/EthereumDIDRegistry.sol"]
